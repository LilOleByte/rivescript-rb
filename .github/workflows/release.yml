name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish gem release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build and verify package
        run: bundle exec rake package

      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/rivescript-rb-*.gem
          body: |
            RiveScript Ruby gem release.

            Includes the interpreter and the bundled sample brain (`eg/brain`).

            Install from RubyGems:

            ```bash
            gem install rivescript-rb
            ```

            Or in a Gemfile:

            ```ruby
            gem "rivescript-rb", "~> 0.1.1"
            ```

            Load the shipped brain in any app:

            ```ruby
            require "rivescript"
            bot = RiveScript.new
            bot.load_directory(RiveScript.brain_path)
            bot.sort_replies
            ```

            See `Changes.md` for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
