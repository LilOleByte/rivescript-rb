name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rake test

  package:
    name: Build gem + brain
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build and verify package
        run: bundle exec rake package

      - name: Install gem and load bundled brain
        run: |
          gem_path=$(ls -1 pkg/rivescript-rb-*.gem | tail -1)
          gem install --local "$gem_path"
          ruby -e '
            require "rivescript"
            path = RiveScript.brain_path
            abort "missing brain: #{path}" unless File.directory?(path)
            bot = RiveScript.new
            bot.load_directory(path)
            bot.sort_replies
            reply = bot.reply("ci", "Hello bot")
            abort "empty reply" if reply.to_s.strip.empty?
            puts "brain=#{path}"
            puts "reply=#{reply}"
            puts "version=#{RiveScript::VERSION}"
          '

      - name: Upload gem artifact
        uses: actions/upload-artifact@v6
        with:
          name: rivescript-rb-gem
          path: pkg/rivescript-rb-*.gem
