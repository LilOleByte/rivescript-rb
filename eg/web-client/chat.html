<!DOCTYPE html>
<html>
<head>
<title>RiveScript-RB</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="chat.css">
</head>
<body>

<h1>Chat</h1>

<p class="note">
  Ruby backend · RiveScript.rb via <code>/api/reply</code>
</p>

<fieldset>
	<legend>Chat Log</legend>
	<div id="dialogue"></div>
</fieldset>

<form id="chat-form">
	<fieldset>
		<legend>Send a Message</legend>

		<table class="input-table">
			<tr>
				<td class="text-box">
					<input type="text" size="40" name="message" id="message" autocomplete="off" disabled placeholder="Please wait... loading...">
				</td>
				<td class="send-button">
					<input type="submit" value="Send">
				</td>
			</tr>
		</table>
	</fieldset>
</form>

<fieldset>
	<legend>Debugger</legend>
	<input type="button" value="Clear Log" id="clear-debug">
	<div id="debug"></div>
</fieldset>

<script type="text/javascript">
var username = "soandso";
var version = "?";

function appendDialogue(who, text, cls) {
	var div = document.createElement("div");
	div.innerHTML = "<span class='" + cls + "'>" + who + ":</span> " +
		String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
	document.getElementById("dialogue").appendChild(div);
	document.getElementById("dialogue").scrollTop = document.getElementById("dialogue").scrollHeight;
}

function debug(msg) {
	var div = document.createElement("div");
	div.textContent = "[RS] " + msg;
	document.getElementById("debug").appendChild(div);
}

function onReady(ver) {
	version = ver;
	appendDialogue("Bot", "Welcome, this is RiveScript.rb v" + ver + ", ready to chat!", "bot");
	var input = document.getElementById("message");
	input.removeAttribute("disabled");
	input.setAttribute("placeholder", "Send message");
	input.focus();
}

fetch("/api/version")
	.then(function(r) { return r.json(); })
	.then(function(data) { onReady(data.version); })
	.catch(function(err) {
		appendDialogue("Error", "Could not reach Ruby server: " + err, "bot");
		debug(String(err));
	});

document.getElementById("chat-form").addEventListener("submit", function(ev) {
	ev.preventDefault();
	var input = document.getElementById("message");
	var text = input.value;
	if (!text) return;
	input.value = "";
	appendDialogue("You", text, "user");
	debug("reply(" + username + ", " + text + ")");

	fetch("/api/reply", {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify({ username: username, message: text })
	})
		.then(function(r) { return r.json(); })
		.then(function(data) {
			if (data.error) throw new Error(data.error);
			appendDialogue("Bot", data.reply, "bot");
		})
		.catch(function(err) {
			appendDialogue("Error", err.message, "bot");
			debug(String(err));
		});
});

document.getElementById("clear-debug").addEventListener("click", function() {
	document.getElementById("debug").innerHTML = "";
});
</script>

</body>
</html>
